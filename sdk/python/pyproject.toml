[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gsusb"
version = "0.1.0"
description = "Python SDK for the gs_usb userspace CAN driver (ctypes bindings over libgsusb.so)"
readme = "README.md"
requires-python = ">=3.7"

[tool.setuptools.packages.find]
include = ["gsusb*"]
